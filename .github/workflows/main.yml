name: Deploy Master Group


on: push


jobs:


  deploy:


    runs-on: ubuntu-latest


    steps:


      - uses: actions/checkout@v7

      - name: Write deployment version
        run: echo '{"version":"${{ github.sha }}"}' > build-info.json


      - uses: shipstatic/action@v2


        with:


          token: ${{ secrets.SHIP_TOKEN }}


          path: .
